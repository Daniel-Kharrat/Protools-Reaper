<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel's REAPER Keyboard Shortcuts</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1b1b1f; --muted:#6b6b76; --border:#e3e3e8;
  --accent:#4b5fd1;
  --changed:#fff2cc; --changed-text:#6b5900;
  --added:#e2efda; --added-text:#2c5c2f;
  --removed:#f8cbad; --removed-text:#7a3312;
  --unchanged:#ededed; --unchanged-text:#555;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111114; --panel:#1a1a1f; --text:#eaeaef; --muted:#9a9aa5; --border:#2c2c34;
    --accent:#8b9bff;
    --changed:#4a4322; --changed-text:#f0dd8a;
    --added:#26402a; --added-text:#a8dcae;
    --removed:#4a2c1f; --removed-text:#f0b191;
    --unchanged:#2a2a30; --unchanged-text:#b7b7c0;
  }
}
*{box-sizing:border-box}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); padding:16px;
}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
.controls{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;
  position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5;
}
input[type=search]{
  flex:1 1 220px; padding:9px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--panel); color:var(--text); font-size:.95rem;
}
.chip{
  border:1px solid var(--border); background:var(--panel); color:var(--text);
  padding:6px 12px; border-radius:999px; font-size:.82rem; cursor:pointer; user-select:none;
  white-space:nowrap;
}
.chip[aria-pressed=true]{ background:var(--accent); color:#fff; border-color:var(--accent); }
.count{color:var(--muted); font-size:.85rem; margin-left:auto}
table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:10px; overflow:hidden}
thead th{
  text-align:left; font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted);
  padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap;
}
thead th:hover{color:var(--text)}
tbody td{padding:10px 12px; border-bottom:1px solid var(--border); font-size:.9rem; vertical-align:top}
tbody tr:hover{background:rgba(127,127,127,.06)}
.line{display:block}
.line+.line{margin-top:4px; padding-top:4px; border-top:1px dashed var(--border)}
.badge{display:inline-block; padding:2px 8px; border-radius:6px; font-size:.75rem; font-weight:600}
.badge.Changed{background:var(--changed); color:var(--changed-text)}
.badge.Added{background:var(--added); color:var(--added-text)}
.badge.Removed{background:var(--removed); color:var(--removed-text)}
.badge.Unchanged{background:var(--unchanged); color:var(--unchanged-text)}
.group-tag{color:var(--muted); font-size:.8rem}
kbd{
  background:var(--bg); border:1px solid var(--border); border-bottom-width:2px; border-radius:5px;
  padding:1px 6px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.82rem;
}
footer{color:var(--muted); font-size:.8rem; margin-top:24px; text-align:center}
a{color:var(--accent)}
.empty{padding:30px; text-align:center; color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Daniel's REAPER Keyboard Shortcuts</h1>
  <p class="sub">Custom shortcuts vs. REAPER's factory defaults. Search or filter below.</p>

  <div class="controls">
    <input type="search" id="q" placeholder="Search actions, keys, scripts...">
    <button class="chip" data-filter="status" data-value="Changed" aria-pressed="false">Changed</button>
    <button class="chip" data-filter="status" data-value="Added" aria-pressed="false">Added</button>
    <button class="chip" data-filter="status" data-value="Removed" aria-pressed="false">Removed</button>
    <button class="chip" data-filter="source" data-value="Script" aria-pressed="false">Scripts</button>
    <button class="chip" data-filter="source" data-value="Built-in" aria-pressed="false">Built-in</button>
    <span class="count" id="count"></span>
  </div>

  <table id="tbl">
    <thead>
      <tr>
        <th data-key="group">Group</th>
        <th data-key="status">Status</th>
        <th data-key="default">Default action</th>
        <th data-key="shortcut">Shortcut</th>
        <th data-key="your">Your action</th>
        <th data-key="source">Source</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No shortcuts match your search/filters.</div>

  <footer>Generated from reaper-kb.ini compared against REAPER's factory keymap. &middot; 120 shortcuts</footer>
</div>

t": ["Ctrl+M"], "your": "Item properties: Toggle items/tracks mute (depending on focus)", "source": "Built-in"}, {"group": "Ungrouped", "status": ["Changed"], "default": ["Transport: Record"], "shortcut": ["Ctrl+R"], "your": "Item properties: Toggle take reverse", "source": "Built-in"}, {"group": "Ungrouped", "status": ["Added"], "default": ["(nothing – key had no default action)"], "shortcut": ["Ctrl+Shift+I"], "your": "Insert/import media files...", "source": "Built-in"}, {"group": "Ungrouped", "status": ["Added"], "default": ["(nothing – key had no default action)"], "shortcut": ["§"], "your": "Item properties: Show media item source properties", "source": "Built-in"}, {"group": "Ungrouped", "status": ["Added"], "default": ["(nothing – key had no default action)"], "shortcut": ["Ctrl+W"], "your": "Close current project tab", "source": "Built-in"}, {"group": "Ungrouped", "status": ["Removed", "Changed"], "default": ["View: Scroll vertically (MIDI CC relative/mousewheel)", "View: Zoom horizontally (MIDI CC relative/mousewheel)"], "shortcut": ["Ctrl+Alt+Mousewheel", "Mousewheel"], "your": "View: Scroll vertically (MIDI CC relative/mousewheel)", "source": "Built-in"}, {"group": "Ungrouped", "status": ["Changed", "Added", "Added"], "default": ["View: Scroll horizontally (MIDI CC relative/mousewheel)", "(nothing – key had no default action)", "(nothing – key had no default action)"], "shortcut": ["HorizWheel", "Shift+HorizWheel", "Shift+Mousewheel"], "your": "View: Scroll horizontally reversed (MIDI CC relative/mousewheel)", "source": "Built-in"}, {"group": "Ungrouped", "status": ["Added"], "default": ["(nothing – key had no default action)"], "shortcut": ["Alt+{ (Alt+Shift+[)"], "your": "Peaks: Decrease peaks display zoom for project", "source": "Built-in"}, {"group": "Ungrouped", "status": ["Added"], "default": ["(nothing – key had no default action)"], "shortcut": ["Alt+} (Alt+Shift+])"], "your": "Peaks: Increase peaks display zoom for project", "source": "Built-in" let activeFilters = { status: new Set(), source: new Set() };
let sortKey = null, sortDir = 1;

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderLines(arr, cls){
  return arr.map(v => `<span class="line ${cls?cls+' '+v:''}">${cls==='badge'?`<span class="badge ${v}">${v}</span>`:escapeHtml(v)}</span>`).join('');
}

function matches(row, q){
  if(activeFilters.status.size && !row.status.some(s => activeFilters.status.has(s))) return false;
  if(activeFilters.source.size && !activeFilters.source.has(row.source)) return false;
  if(!q) return true;
  const hay = [row.group, ...row.status, ...row.default, ...row.shortcut, row.your, row.source].join(' ').toLowerCase();
  return hay.includes(q);
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  let rows = DATA.filter(r => matches(r, q));
  if(sortKey){
    rows = rows.slice().sort((a,b) => {
      const av = Array.isArray(a[sortKey]) ? a[sortKey].join(' ') : a[sortKey];
      const bv = Array.isArray(b[sortKey]) ? b[sortKey].join(' ') : b[sortKey];
      return av.localeCompare(bv) * sortDir;
    });
  }
  const tbody = document.getElementById('tbody');
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('count').textContent = rows.length + ' / ' + DATA.length;
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td><span class="group-tag">${escapeHtml(r.group)}</span></td>
      <td>${renderLines(r.status,'badge')}</td>
      <td>${renderLines(r.default)}</td>
      <td>${r.shortcut.map(s=>`<span class="line"><kbd>${escapeHtml(s)}</kbd></span>`).join('')}</td>
      <td>${escapeHtml(r.your)}</td>
      <td>${escapeHtml(r.source)}</td>
    </tr>`).join('');
}

document.getElementById('q').addEventListener('input', render);
document.querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter, v = btn.dataset.value;
    const set = activeFilters[f];
    if(set.has(v)){ set.delete(v); btn.setAttribute('aria-pressed','false'); }
    else { set.add(v); btn.setAttribute('aria-pressed','true'); }
    render();
  });
});
document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if(sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    render();
  });
});
render();
</script>
